name: "Adopt Relock"
description: >-
  Lock the composer.lock of every branch Sisyphus opened to adopt a plugin
  production runs outside the repository (sisyphus/adopt/<slug>). Sisyphus has
  no Composer, so it opens the pull request with composer.json alone, which
  requires the plugin at the version production runs; this re-locks exactly
  that package on the branch with composer-relock's relock.sh, and pushes, so
  the pull request's checks can pass. A branch it cannot lock gets a warning
  with Composer's reason, and the others are still locked. adopt.sh has the
  rules.

  Run it in a checkout with credentials that can push to those branches.

inputs:
  working-directory:
    description: "A checkout of the repository, with push credentials. Its branch is put back when this is done."
    required: false
    default: "."
  pattern:
    description: "The branches to lock, as a git ref pattern under refs/heads/"
    required: false
    default: "sisyphus/adopt/*"
  dry-run:
    description: "Lock in the checkout, but commit and push nothing (true/false)"
    required: false
    default: "false"
  composer-auth:
    description: "COMPOSER_AUTH JSON, for private Composer repositories such as packagist.linchpin.com"
    required: false
    default: ""
  php-version:
    description: >-
      PHP version Composer runs on, normally the repository's PHP_VERSION.
      Empty falls back to composer.json's config.platform.php, then to the
      runner's own.
    required: false
    default: ""
  git-user-name:
    description: "Author of the lock commits"
    required: false
    default: "linchpin-bot"
  git-user-email:
    description: "Author email of the lock commits"
    required: false
    default: "81971745+linchpin-bot@users.noreply.github.com"

outputs:
  branches:
    description: "The branches found, one per line"
    value: ${{ steps.find.outputs.branches }}
  locked:
    description: "What was locked, one 'branch name old new' per line"
    value: ${{ steps.adopt.outputs.locked }}

runs:
  using: "composite"
  steps:
    - name: Find the branches to lock
      id: find
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PATTERN: ${{ inputs.pattern }}
      run: |
        branches=$(git ls-remote --heads origin "refs/heads/$PATTERN" | awk '{ sub("refs/heads/", "", $2); print $2 }')
        {
          echo "branches<<ADOPT_EOF"
          printf '%s\n' "$branches"
          echo "ADOPT_EOF"
        } >> "$GITHUB_OUTPUT"
        echo "count=$(printf '%s' "$branches" | grep -c . || true)" >> "$GITHUB_OUTPUT"

    - name: Choose the PHP version Composer runs on
      id: php
      if: ${{ steps.find.outputs.count != '0' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PHP_VERSION: ${{ inputs.php-version }}
      run: |
        if [ -z "$PHP_VERSION" ] && [ -f composer.json ]; then
          PHP_VERSION=$(jq -r '.config.platform.php // empty' composer.json | cut -d. -f1,2)
        fi
        if [ -z "$PHP_VERSION" ]; then
          PHP_VERSION=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')
        fi
        echo "version=$PHP_VERSION" >> "$GITHUB_OUTPUT"

    - name: Setup PHP
      if: ${{ steps.find.outputs.count != '0' }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ steps.php.outputs.version }}
        coverage: none
        tools: composer

    - name: Lock each branch
      id: adopt
      if: ${{ steps.find.outputs.count != '0' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BRANCHES: ${{ steps.find.outputs.branches }}
        DRY_RUN: ${{ inputs.dry-run }}
        COMPOSER_AUTH: ${{ inputs.composer-auth }}
        RELOCK: ${{ github.action_path }}/../composer-relock/relock.sh
        GIT_AUTHOR_NAME: ${{ inputs.git-user-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-user-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-user-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-user-email }}
      run: bash "${{ github.action_path }}/adopt.sh"
