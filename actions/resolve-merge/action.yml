name: "Resolve Merge"
description: >-
  Bring one branch into the checked-out branch when GitHub refuses the merge,
  resolving the conflicts dependency updates leave in package.json,
  composer.json, package-lock.json and composer.lock deterministically, then
  commit and push the merge. Each value comes from the side that changed it;
  anything it cannot resolve that way, or any other conflicted file, is left
  alone and reported (resolved=false), and nothing is pushed. resolve-merge.sh
  has the rules.

  Run it in a checkout of the branch with full history, and credentials that
  can push to it.

inputs:
  from:
    description: "The ref to bring in. Defaults to the repository's default branch on origin."
    required: false
    default: ""
  branch:
    description: "The branch to push the merge to. Defaults to the checked-out branch."
    required: false
    default: ""
  working-directory:
    description: "The checkout to resolve in"
    required: false
    default: "."
  dry-run:
    description: "Resolve and commit in the checkout, but push nothing (true/false)"
    required: false
    default: "false"
  composer-auth:
    description: "COMPOSER_AUTH JSON, for private Composer repositories such as packagist.linchpin.com"
    required: false
    default: ""
  npm-token:
    description: "An npm read token, for private npm packages"
    required: false
    default: ""
  node-version:
    description: "Node version npm repairs lockfiles with"
    required: false
    default: "24"
  php-version:
    description: "PHP version Composer runs on. Defaults to the runner's own: Composer only resolves, and composer.json's config.platform pins what it resolves for."
    required: false
    default: ""
  git-user-name:
    description: "Author of the merge commit"
    required: false
    default: "linchpin-bot"
  git-user-email:
    description: "Author email of the merge commit"
    required: false
    default: "81971745+linchpin-bot@users.noreply.github.com"

outputs:
  resolved:
    description: "true when the merge was resolved and pushed (or committed, on a dry run)"
    value: ${{ steps.resolve.outputs.resolved == 'true' }}
  sha:
    description: "The merge commit"
    value: ${{ steps.resolve.outputs.sha }}
  reason:
    description: "Why it gave up"
    value: ${{ steps.resolve.outputs.reason }}
  unresolved:
    description: "Space-separated files it could not resolve, for a fallback or a person"
    value: ${{ steps.resolve.outputs.unresolved }}

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Read the runner's PHP version
      id: php
      shell: bash
      env:
        PHP_VERSION: ${{ inputs.php-version }}
      run: |
        if [ -z "$PHP_VERSION" ]; then
          PHP_VERSION=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')
        fi
        echo "version=$PHP_VERSION" >> "$GITHUB_OUTPUT"

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ steps.php.outputs.version }}
        coverage: none
        tools: composer

    # Giving up is an answer, not a failure: the caller reads `resolved` and
    # decides what happens next.
    - name: Resolve the merge
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MERGE_FROM: ${{ inputs.from || format('origin/{0}', github.event.repository.default_branch) }}
        MERGE_BRANCH: ${{ inputs.branch }}
        DRY_RUN: ${{ inputs.dry-run }}
        COMPOSER_AUTH: ${{ inputs.composer-auth }}
        NPM_TOKEN: ${{ inputs.npm-token }}
        GIT_AUTHOR_NAME: ${{ inputs.git-user-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-user-email }}
        GIT_COMMITTER_NAME: ${{ inputs.git-user-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        if ! bash "${{ github.action_path }}/resolve-merge.sh"; then
          echo "::warning::The merge was not resolved; see the step summary for why."
        fi
