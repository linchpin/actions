# Rolling Maintenance (linchpin/actions v4)
#
# Keeps the permanent `maintenance` branch current: brings @PRODUCTION_BRANCH@ in, then
# merges green Renovate PRs into it. It never promotes; snapshots.yml does, and
# only through a PR a person merges. linchpin/actions rolling-maintenance.yml
# has the detail. Sisyphus on packagist.linchpin.com dispatches this file by
# name before each nightly deploy to dev, so keep its name.
#
# Written by linchpin/actions bin/convert-repo.

name: Rolling Maintenance

# A dispatch returns no run id, so Sisyphus finds its run by the correlation_id
# it put in the name. A name that is only whitespace keeps GitHub's own.
run-name: >-
  ${{ inputs.correlation_id
  && format('Rolling Maintenance {0}', inputs.correlation_id)
  || ' ' }}

on:
  # A change on production: bring it into the branch.
  push:
    branches: ['@PRODUCTION_BRANCH@']
  # CI finishing on a PR into the branch, or on a Governing bump: merge what is
  # green. The shared job skips every other CI run, at no cost.
  workflow_run:
    workflows: ['@CI_WORKFLOW@']
    types: [completed]
    branches: ['renovate/**', 'governing/**']
  # An approving review: an approved major can merge.
  pull_request_review:
    types: [submitted]
  # Safety net for a missed event.
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be merged without writing anything"
        type: boolean
        default: false
      correlation_id:
        description: "Set by Sisyphus to find this run; leave it empty"
        type: string
        required: false

permissions:
  contents: read

# Dispatches queue apart from event runs. GitHub keeps one pending run per
# group, so in a single group a push or a finished CI run could replace the
# dispatch Sisyphus is waiting for, and the night would fail as cancelled.
concurrency:
  group: rolling-maintenance-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'events' }}
  cancel-in-progress: false

jobs:
  roll:
    uses: linchpin/actions/.github/workflows/rolling-maintenance.yml@v4
    secrets: inherit
    with:
      dry_run: ${{ inputs.dry_run || false }}
