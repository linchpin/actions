# Update README.md + composer.lock (v4)
#
# Regenerates the README's release date and plugin/theme table on the release
# PR's branch, re-syncs composer.lock there, and commits both straight onto that
# branch. So they merge with the release PR and reach the default branch with the
# release itself.
#
# Call it every time release-please writes its PR, from the action's
# `prs_created` output:
#
#   jobs:
#     release-please:
#       outputs:
#         prs_created: ${{ steps.release.outputs.prs_created }}
#       ...
#     update-readme:
#       needs: [release-please]
#       if: ${{ needs.release-please.outputs.prs_created == 'true' }}
#       uses: linchpin/actions/.github/workflows/update-readme.yml@v4
#       secrets: inherit
#
# release-please rebuilds its branch from the default branch whenever the release
# notes change, which drops anything committed on top of it, and `prs_created` is
# true exactly then. Gated on composer.lock changing instead, the README is dropped
# by the next rewrite; gated on `release_created`, it lands on a branch that has
# already merged. linchpin.com did both, and its README date stood still for 24
# releases.
#
# History:
#   v3    ran on every push to main and wget'd update-readme.sh from the v3 branch.
#   v4    bundles the script in the update-readme composite action.
#   v4.4  re-syncs composer.lock: release-please bumps `version` in composer.json,
#         which Composer's content-hash covers, so `composer validate` fails on the
#         release branch until something re-locks it.
#   v4.5  merged the README PR it opened, which had sat open for weeks.
#   Now   commits onto the release branch with no PR at all. The PR had no
#         reviewer and no required check; it existed only to be merged, and every
#         workflow listening for PRs listed a run of its own for it.

name: Update README.md

on:
  workflow_call:
    inputs:
      base:
        description: "The release PR's branch, which the README is committed onto"
        required: false
        default: "release-please--branches--main"
        type: string
      runner:
        description: "Runner label for this workflow's jobs. Defaults to vars.RUNNER, then ubuntu-latest"
        required: false
        default: ""
        type: string
    secrets:
      GH_BOT_TOKEN:
        description: "Token the README commit is pushed with"
        required: true
      PACKAGIST_COMPOSER_AUTH_JSON:
        description: "auth.json contents for packagist.linchpin.com, which the composer.lock sync resolves against"
        required: false

# The push uses GH_BOT_TOKEN, so GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  update-readme:
    name: Update Readme
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # Checked out with the bot's token, which the push below reuses. A push made
      # with GITHUB_TOKEN starts no workflow, so the release PR's new head would
      # have no check runs, and a required check would wait on it forever.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          sparse-checkout: |
            README.md
            composer.json
            composer.lock
          sparse-checkout-cone-mode: false

      # Best-effort: a failed resolution (network, a private repository with no
      # credentials) must not break the README update, so restore the lock and
      # continue. Without COMPOSER_AUTH, packagist.linchpin.com answers 401.
      - name: Sync composer.lock with composer.json
        env:
          COMPOSER_AUTH: ${{ secrets.PACKAGIST_COMPOSER_AUTH_JSON }}
        run: |
          if [ ! -f composer.json ] || [ ! -f composer.lock ]; then
            echo "No composer.json/composer.lock — skipping lock sync"
            exit 0
          fi
          if composer update --lock --no-install --no-scripts --no-plugins --no-audit --no-interaction; then
            echo "composer.lock is in sync with composer.json"
          else
            echo "::warning::composer update --lock failed; leaving composer.lock unchanged"
            git checkout -- composer.lock
          fi

      - name: Update README.md from composer.lock
        uses: linchpin/actions/actions/update-readme@v4

      # Not a conventional commit, on purpose: a release PR merged with a merge
      # commit would otherwise list it in the next release's notes. No force: if
      # release-please rewrote the branch since the checkout, the push fails, and
      # the run that rewrote it regenerates the README.
      - name: Commit onto the release branch
        env:
          BASE: ${{ inputs.base }}
        run: |
          git config --local user.email "linchpin-bot@github.com"
          git config --local user.name "Linchpin Bot"
          git add README.md composer.lock
          if git diff --cached --quiet; then
            echo "README.md and composer.lock are already current."
            exit 0
          fi
          git commit -m "Update README.md plugin list and sync composer.lock"
          git push origin "HEAD:refs/heads/$BASE"
