# Continue Deploy (v4)
#
# Finishes a `do_backup` deploy from deploy.yml once api.linchpin.com has
# backed the site up. api dispatches the caller's continue workflow with
# deployment_id and workflow_run_id as string inputs, so the caller must
# declare both.
#
# Previous (v3): deploy-pressable-continue.yml. The plumbing had gaps that
# kept the flow aspirational: the caller's dispatch workflow declared no
# inputs (it read github.event.deployment.id, which a workflow_dispatch
# payload does not carry), and the artifact download never passed run-id or a
# token, so it could not fetch the artifact from the original run.
#
# Next (v4): explicit dispatch inputs, cross-run artifact download via
# download-artifact's run-id + github-token (requires actions: read), or —
# when the original deploy used a release asset — re-download by release_tag.
# Status updates target the deployment_id created by the original run.

name: Continue Deploy

on:
  workflow_call:
    inputs:
      deployment_id:
        description: "GitHub deployment ID created by the original deploy run"
        required: true
        type: string
      workflow_run_id:
        description: "Run ID of the original deploy (source of the release artifact)"
        required: true
        type: string
      release_tag:
        description: "When the original deploy used a release asset, re-download it by tag instead of the run artifact"
        required: false
        default: ""
        type: string
      environment:
        description: "The environment to deploy to"
        required: false
        default: "staging"
        type: string
      maintenance_mode:
        description: "Enable maintenance mode during the sync"
        required: false
        default: false
        type: boolean
      post_deploy_command:
        description: "Optional shell commands run on the server after deployment"
        required: false
        default: ""
        type: string
      health_check:
        description: "Fail the deploy if the site does not respond after the sync"
        required: false
        default: true
        type: boolean
      protected_paths:
        description: >-
          Paths this deploy must never overwrite, relative to wp-content
          (one per line, comma separated, or a JSON array; globs allowed).
          Defaults to vars.PROTECTED_PATHS.
        required: false
        default: ""
        type: string
      preserve_symlinks:
        description: >-
          Leave plugins/themes/mu-plugins that are symlinks on the server exactly
          as they are (Pressable links platform-owned plugins such as jetpack and
          woocommerce into wp-content).
        required: false
        default: true
        type: boolean
      runner:
        description: "Runner label for this workflow's jobs. Defaults to vars.RUNNER, then ubuntu-latest"
        required: false
        default: ""
        type: string
    secrets:
      PRESSABLE_API_CLIENT_ID:
        required: false
      PRESSABLE_API_CLIENT_SECRET:
        required: false
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_KEY:
        required: false
      SATISPRESS_USER:
        description: "Private Packagist username, used only by the REMOTE_PLUGIN_INSTALL reconcile"
        required: false
      SATISPRESS_PASSWORD:
        description: "Private Packagist password, used only by the REMOTE_PLUGIN_INSTALL reconcile"
        required: false
      DEPLOYMENTS_API_CLIENT_ID:
        description: "api.linchpin.com application client with deployments:write, for the deployment log"
        required: false
      DEPLOYMENTS_API_CLIENT_SECRET:
        description: "That client's secret"
        required: false

jobs:
  deploy:
    name: Continue deploy to ${{ inputs.environment }}
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    # The steps below update the original run's deployment.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_URL }}
      deployment: false
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      actions: read # required to download the artifact from the original run
    steps:
      - name: Set deployment status to in_progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ inputs.deployment_id }}/statuses" \
            --method POST \
            --field state=in_progress \
            --field environment="${{ inputs.environment }}" \
            --field environment_url="${{ vars.SITE_URL }}" \
            --field log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Single release.zip from the original run (build.yml packaged it once).
      # Land it at the workspace root and pass it through — the server entrypoint
      # is the only place it gets unzipped.
      - name: Download release artifact from run ${{ inputs.workflow_run_id }}
        if: ${{ inputs.release_tag == '' }}
        uses: actions/download-artifact@v8
        with:
          name: release
          path: .
          run-id: ${{ inputs.workflow_run_id }}
          github-token: ${{ github.token }}

      - name: Download release.zip from release ${{ inputs.release_tag }}
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wait for the asset in case the deploy build is still attaching it
          # (see the note in deploy.yml's equivalent step).
          TAG="${{ inputs.release_tag }}"
          REPO="${{ github.repository }}"
          for attempt in $(seq 1 40); do
            # Leave release.zip at the workspace root for the host action to ship.
            if gh release download "$TAG" --pattern release.zip --repo "$REPO" --clobber 2>/dev/null; then
              exit 0
            fi
            echo "release.zip not attached to $TAG yet (attempt $attempt/40) — waiting 15s…"
            sleep 15
          done
          echo "::error::release.zip never appeared on $TAG after ~10 min."
          exit 1

      - name: Deploy to Pressable
        if: ${{ vars.HOST == 'pressable' }}
        uses: linchpin/actions/actions/deploy-pressable@v4
        with:
          site-id: ${{ vars.SITE_ID }}
          site-url: ${{ vars.SITE_URL }}
          api-client-id: ${{ secrets.PRESSABLE_API_CLIENT_ID }}
          api-client-secret: ${{ secrets.PRESSABLE_API_CLIENT_SECRET }}
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          release-archive: ${{ github.workspace }}/release.zip
          maintenance-mode: ${{ inputs.maintenance_mode }}
          post-deploy-command: ${{ inputs.post_deploy_command }}
          health-check: ${{ inputs.health_check }}
          protected-paths: ${{ inputs.protected_paths || vars.PROTECTED_PATHS }}
          preserve-symlinks: ${{ inputs.preserve_symlinks }}

      - name: Unsupported host
        if: ${{ vars.HOST != 'pressable' }}
        run: |
          echo "::error::The backup-and-continue flow currently supports HOST=pressable only (the backup is a Pressable API feature)"
          exit 1

      # Mirrors deploy.yml: without this, a do_backup deploy would finish here
      # having synced only the project's own code and never reconciled the
      # Composer-managed packages, while still reporting success.
      - name: Extract composer.lock from the release
        if: ${{ vars.REMOTE_PLUGIN_INSTALL == 'true' }}
        run: |
          if ! unzip -o -q "${{ github.workspace }}/release.zip" composer.lock -d "${{ github.workspace }}"; then
            echo "::error::composer.lock is not in release.zip."
            echo "REMOTE_PLUGIN_INSTALL needs it — check that the project .distignore does not exclude it."
            exit 1
          fi

      - name: Remote plugin install
        if: ${{ vars.REMOTE_PLUGIN_INSTALL == 'true' }}
        uses: linchpin/actions/actions/remote-plugin-install@v4
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          wp-path: /srv/htdocs
          composer-lock: ${{ github.workspace }}/composer.lock
          protected-paths: ${{ inputs.protected_paths || vars.PROTECTED_PATHS }}
          preserve-symlinks: ${{ inputs.preserve_symlinks }}
          package-auth-user: ${{ secrets.SATISPRESS_USER }}
          package-auth-password: ${{ secrets.SATISPRESS_PASSWORD }}

      - name: Mark deployment successful
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ inputs.deployment_id }}/statuses" \
            --method POST \
            --field state=success \
            --field environment="${{ inputs.environment }}" \
            --field environment_url="${{ vars.SITE_URL }}" \
            --field log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark deployment failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ inputs.deployment_id }}/statuses" \
            --method POST \
            --field state=failure \
            --field environment="${{ inputs.environment }}" \
            --field environment_url="${{ vars.SITE_URL }}" \
            --field log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # The deployment log on api.linchpin.com.
      - name: Report to the deployment log
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: linchpin/actions/actions/report-deployment@v4
        with:
          deployment-id: ${{ inputs.deployment_id }}
          status: ${{ job.status }}
          environment-url: ${{ vars.SITE_URL }}
          client-id: ${{ secrets.DEPLOYMENTS_API_CLIENT_ID }}
          client-secret: ${{ secrets.DEPLOYMENTS_API_CLIENT_SECRET }}
