# Lint PHP (v4)
#
# Previous (v3): three separate workflows ran on every PHP PR — phplint.yml,
# phpcs.yml and phpcbf.yml — each with its own checkout, PHP setup and
# Composer install, using incompatible cache keys (or `composer update` and no
# cache at all in phpcbf). phplint.yml also hardcoded one step per PHP version
# (8.0–8.3 pinned to different overtrue/phplint releases), so projects on
# PHP > 8.3 silently skipped linting while reporting green.
#
# Next (v4): one job, one cached Composer install, version-agnostic tools.
# Syntax lint via the project's php-parallel-lint, coding standards via the
# project's phpcs on the files changed in the PR (annotated inline through
# cs2pr), and optional PHPStan. Auto-fixing (phpcbf) is intentionally not a
# CI concern anymore — run it locally in a pre-commit hook.

name: Lint PHP

on:
  workflow_call:
    inputs:
      php_version:
        description: "PHP version. Defaults to vars.PHP_VERSION"
        required: false
        default: ""
        type: string
      run_phpstan:
        description: "Also run PHPStan (composer lint:phpstan or vendor/bin/phpstan)"
        required: false
        default: false
        type: boolean
      lint_paths:
        description: >-
          Space-separated paths to syntax-lint. Defaults to the whole
          repository. A wp-content-shaped repo wants its own theme or plugin
          here — after Composer install the tree also holds third-party plugin
          code, whose syntax is not ours to police.
        required: false
        default: "."
        type: string
      require_tools:
        description: >-
          Fail when php-parallel-lint or phpcs is missing, rather than skipping
          the check. A skipped gate reports green, which is worse than no gate
          because it looks like one. Set false only while a project is being
          migrated onto its own tooling.
        required: false
        default: true
        type: boolean
    secrets:
      PACKAGIST_COMPOSER_AUTH_JSON:
        required: false

jobs:
  lint:
    name: PHP lint + coding standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so changed files can be diffed against the PR base

      - name: Setup PHP and install Composer dependencies (with dev tools)
        uses: linchpin/actions/actions/setup-wp-php@v4
        with:
          php-version: ${{ inputs.php_version || vars.PHP_VERSION }}
          dev: "yes"
          composer-auth: ${{ secrets.PACKAGIST_COMPOSER_AUTH_JSON }}

      - name: PHP syntax lint
        env:
          REQUIRE_TOOLS: ${{ inputs.require_tools }}
          LINT_PATHS: ${{ inputs.lint_paths }}
        run: |
          set -euo pipefail
          if composer run-script --list 2>/dev/null | grep -qE '^\s*lint:php([^a-z:]|$)'; then
            composer run-script lint:php
          elif [ -x vendor/bin/parallel-lint ]; then
            # Every vendor/ and node_modules/ at any depth, not just the top
            # level. `--exclude vendor` is a path relative to cwd, so it misses
            # plugins/*/vendor — which Composer install creates, and which is
            # where third-party code lives. php-di ships a compiler template
            # that is deliberately not valid standalone PHP, so a bundled plugin
            # failing this job says nothing about the project.
            read -r -a LINT_TARGETS <<< "${LINT_PATHS}"
            EXCLUDE_ARGS=()
            while IFS= read -r dir; do
              [ -n "$dir" ] && EXCLUDE_ARGS+=(--exclude "$dir")
            done < <(find "${LINT_TARGETS[@]}" -type d \( -name vendor -o -name node_modules \) -prune -print 2>/dev/null)
            vendor/bin/parallel-lint "${LINT_TARGETS[@]}" \
              ${EXCLUDE_ARGS[@]+"${EXCLUDE_ARGS[@]}"} -e php
          elif [ "${REQUIRE_TOOLS}" = "true" ]; then
            echo "::error::php-parallel-lint is not installed, so nothing checked syntax." \
              "Add php-parallel-lint/php-parallel-lint to require-dev, or set" \
              "require_tools: false while migrating."
            exit 1
          else
            echo "::warning::php-parallel-lint is not installed in this project — syntax lint skipped."
          fi

      - name: PHPCS on changed files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          REQUIRE_TOOLS: ${{ inputs.require_tools }}
        run: |
          set -euo pipefail
          if [ ! -x vendor/bin/phpcs ]; then
            if [ "${REQUIRE_TOOLS}" = "true" ]; then
              echo "::error::phpcs is not installed, so nothing checked coding standards." \
                "Add linchpin/coding-standards to require-dev, or set" \
                "require_tools: false while migrating."
              exit 1
            fi
            echo "::warning::phpcs is not installed in this project — coding standards check skipped."
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.php')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PHP files changed in this PR — skipping phpcs"
            exit 0
          fi
          echo "Checking ${#files[@]} changed PHP file(s)"
          # `ignore_warnings_on_exit` makes warnings annotate without failing the
          # job. phpcs exits 1 for a warnings-only run and 2 when there are errors,
          # and this pipeline runs under `set -euo pipefail` — so without the flag a
          # single warning anywhere in a changed file fails lint no matter what the
          # change was.
          #
          # That is not hypothetical. On linchpin.com it meant touching any of the
          # eleven files carrying the standard `defined( 'ABSPATH' ) || exit;` guard
          # hard-failed lint, because PSR1.Files.SideEffects warns about it; the
          # project had to set that sniff to severity 0 in its own ruleset to work
          # around this step, and #989 was merged red for exactly this reason.
          #
          # Errors still fail, which is the intended gate. Warnings are advisory by
          # definition — a standard that wanted them to block would raise them to
          # errors.
          vendor/bin/phpcs -q --runtime-set ignore_warnings_on_exit 1 \
            --report=checkstyle "${files[@]}" | cs2pr

      - name: PHPStan
        if: ${{ inputs.run_phpstan }}
        run: |
          set -euo pipefail
          if composer run-script --list 2>/dev/null | grep -qE '^\s*lint:phpstan'; then
            composer run-script lint:phpstan
          elif [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --no-progress --memory-limit=2G
          else
            echo "::warning::PHPStan requested but not installed in this project — skipped."
          fi
