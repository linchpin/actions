# Rolling Maintenance (v4)
#
# Keeps a site's permanent `maintenance` branch current. Each run brings the
# production branch in, then merges green Renovate PRs into it: automerge-safe
# ones at once, any other once a person approves it. Nothing here promotes;
# snapshots.yml does, through a PR a person merges.
#
# A merge GitHub refuses (both sides changed the same lines, usually a lockfile)
# goes to resolve-merge, then to Sisyphus for any file it cannot settle, and
# opens a maintenance-conflict issue only when both give up.
#
# The same job merges green Linchpin Governing bumps into production and tags
# snapshots merged there, since they share its triggers and token.
#
# The caller owns the triggers, run name and concurrency: Sisyphus dispatches the
# site's own maintenance.yml and finds the run by its correlation_id. See
# templates/rolling-maintenance.
#
# GH_BOT_TOKEN (linchpin-bot) is a PAT, so its pushes and PRs start other
# workflows, and it is exempt from production's ruleset, which governing-merge
# relies on.

name: Rolling Maintenance

on:
  workflow_call:
    inputs:
      branch:
        description: "The maintenance branch"
        required: false
        default: "maintenance"
        type: string
      production_branch:
        description: "The branch brought into it. Defaults to the repository's default branch"
        required: false
        default: ""
        type: string
      skip_checks:
        description: "Checks production requires that never run on PRs into the maintenance branch, one per line"
        required: false
        default: ""
        type: string
      resolve_conflicts:
        description: "Hand a refused merge to resolve-merge before opening an issue"
        required: false
        default: true
        type: boolean
      publish_conflicts:
        description: "Publish files resolve-merge cannot settle for Sisyphus to answer"
        required: false
        default: true
        type: boolean
      governing_merge:
        description: "Also merge green Linchpin Governing bumps into the production branch"
        required: false
        default: true
        type: boolean
      governing_commit_prefix:
        description: "Type and scope of a merged Governing bump's commit, worded like the repository's Renovate updates"
        required: false
        default: "build(composer):"
        type: string
      tidy_snapshots:
        description: "Tag a snapshot merged into the production branch and delete its branch on the push that merges it"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Log what would be merged without writing anything"
        required: false
        default: false
        type: boolean
      runner:
        description: "Runner label for this workflow's jobs. Defaults to vars.RUNNER, then ubuntu-latest"
        required: false
        default: ""
        type: string
    secrets:
      GH_BOT_TOKEN:
        required: true
      PACKAGIST_COMPOSER_AUTH_JSON:
        description: "COMPOSER_AUTH JSON for resolve-merge, for packagist.linchpin.com"
        required: false
      NPM_READ_TOKEN:
        description: "npm read token for resolve-merge, for private @linchpinagency packages"
        required: false

permissions:
  contents: read

jobs:
  roll:
    # The actions ignore this job's own check run ("<caller's job> / Rolling
    # maintenance"); renaming it means passing self-check to each of them.
    name: Rolling maintenance
    # CI results and approvals count only for PRs into the branch or Governing
    # bumps; anything else skips the job, which bills nothing.
    if: >-
      (github.event_name != 'workflow_run' && github.event_name != 'pull_request_review') || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' && (
          github.event.workflow_run.pull_requests[0].base.ref == inputs.branch ||
          startsWith(github.event.workflow_run.head_branch, 'governing/'))) || (
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' && (
          github.event.pull_request.base.ref == inputs.branch ||
          startsWith(github.event.pull_request.head.ref, 'governing/')))
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # No checkout, so no repository or PR code runs with this token.
      - name: Bring production in, merge what is green
        id: roll
        uses: linchpin/actions/actions/rolling-maintenance@v4
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}
          branch: ${{ inputs.branch }}
          production-branch: ${{ inputs.production_branch }}
          skip-checks: ${{ inputs.skip_checks }}
          resolver: ${{ inputs.resolve_conflicts }}
          dry-run: ${{ inputs.dry_run }}

      # Only after a refused merge. Full history, blobless, with the bot's token
      # because the resolved merge is pushed.
      - name: Check out the maintenance branch to resolve the merge
        if: steps.roll.outputs.conflict == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          path: work
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GH_BOT_TOKEN }}

      # Giving up is not a failure: the next step opens the issue. Files it
      # cannot settle go to Sisyphus, whose answers apply on a later run.
      - name: Resolve the merge
        if: steps.roll.outputs.conflict == 'true'
        uses: linchpin/actions/actions/resolve-merge@v4
        with:
          working-directory: work
          from: origin/${{ inputs.production_branch || github.event.repository.default_branch }}
          branch: ${{ inputs.branch }}
          publish-conflicts: ${{ inputs.publish_conflicts }}
          composer-auth: ${{ secrets.PACKAGIST_COMPOSER_AUTH_JSON }}
          npm-token: ${{ secrets.NPM_READ_TOKEN }}

      - name: Bring production in again, or open the issue for a person
        if: steps.roll.outputs.conflict == 'true'
        uses: linchpin/actions/actions/rolling-maintenance@v4
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}
          branch: ${{ inputs.branch }}
          production-branch: ${{ inputs.production_branch }}
          skip-checks: ${{ inputs.skip_checks }}
          resolver: tried
          dry-run: ${{ inputs.dry_run }}

      # Runs even when a step above failed, so a release is never held up.
      - name: Merge green Governing bumps into production
        if: ${{ !cancelled() && inputs.governing_merge }}
        uses: linchpin/actions/actions/governing-merge@v4
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}
          production-branch: ${{ inputs.production_branch }}
          commit-prefix: ${{ inputs.governing_commit_prefix }}
          dry-run: ${{ inputs.dry_run }}

      # A snapshot merged into production arrives as a push; tag it now.
      # snapshots.yml tidies the rest daily.
      - name: Tidy snapshots
        if: ${{ !cancelled() && inputs.tidy_snapshots && github.event_name == 'push' }}
        uses: linchpin/actions/actions/snapshot@v4
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}
          mode: tidy
          branch: ${{ inputs.branch }}
          production-branch: ${{ inputs.production_branch }}
